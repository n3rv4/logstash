input {
  beats {
    port => 5047
  }
}

filter {
  json {
    source => "message"
  }

  if [project] == "atlas_products" {
    if [log_type] == "cli" {
      mutate { add_field => { "[@metadata][target_index]" => "atlas-products-symfony-%{[environment]}-cli-%{+YYYY.MM.dd}" } }
    } else {
      mutate { add_field => { "[@metadata][target_index]" => "atlas-products-symfony-%{[environment]}-%{+YYYY.MM.dd}" } }
    }
  }

  mutate {
    remove_field => ["host", "agent"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][target_index]}"
  }
}
